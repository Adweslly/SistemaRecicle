<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Resíduos - Setores</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
</head>
<body>
<div class="layout">
    <nav class="sidebar">
        <div class="logo">Gestão de Resíduos<small>ISO 14000 · APS</small></div>
        <a href="index.html">Dashboard</a>
        <a href="setores.html" class="ativo">Setores</a>
        <a href="residuos.html">Resíduos</a>
        <a href="pontos.html">Pontos de Coleta</a>
        <a href="coletas.html">Coletas</a>
        <a href="recicladores.html">Recicladores</a>
        <a href="relatorios.html">Relatórios</a>
    </nav>

    <main class="conteudo">
        <h1>Setores</h1>
        <div class="subtitulo">Departamentos que geram resíduos na organização</div>

        <div id="alerta" class="alerta"></div>

        <div class="barra-acoes">
            <button class="btn" onclick="abrirFormulario()">+ Novo setor</button>
        </div>

        <div class="formulario" id="formulario">
            <h3 id="form-titulo">Novo setor</h3>
            <div class="campos">
                <div class="campo">
                    <label>Nome *</label>
                    <input type="text" id="nome" maxlength="100">
                </div>
                <div class="campo">
                    <label>Departamento</label>
                    <input type="text" id="departamento" maxlength="100">
                </div>
                <div class="campo">
                    <label>Localização</label>
                    <input type="text" id="localizacao" maxlength="120">
                </div>
            </div>
            <button class="btn" onclick="salvar()">Salvar</button>
            <button class="btn secundario" onclick="fecharFormulario()">Cancelar</button>
        </div>

        <div class="tabela-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Departamento</th>
                        <th>Localização</th>
                        <th style="width:110px">Ações</th>
                    </tr>
                </thead>
                <tbody id="linhas"></tbody>
            </table>
        </div>
    </main>
</div>
<script src="js/setores.js"></script>
</body>
</html>
