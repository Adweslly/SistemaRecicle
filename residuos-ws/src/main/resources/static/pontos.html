<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Resíduos - Pontos de Coleta</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
</head>
<body>
<div class="layout">
    <nav class="sidebar">
        <div class="logo">Gestão de Resíduos<small>ISO 14000 · APS</small></div>
        <a href="index.html">Dashboard</a>
        <a href="setores.html">Setores</a>
        <a href="residuos.html">Resíduos</a>
        <a href="pontos.html" class="ativo">Pontos de Coleta</a>
        <a href="coletas.html">Coletas</a>
        <a href="recicladores.html">Recicladores</a>
        <a href="relatorios.html">Relatórios</a>
    </nav>

    <main class="conteudo">
        <h1>Pontos de Coleta</h1>
        <div class="subtitulo">Locais internos que recebem e concentram os resíduos</div>

        <div id="alerta" class="alerta"></div>

        <div class="barra-acoes">
            <button class="btn" onclick="abrirFormulario()">+ Novo ponto de coleta</button>
        </div>

        <div class="formulario" id="formulario">
            <h3 id="form-titulo">Novo ponto de coleta</h3>
            <div class="campos">
                <div class="campo">
                    <label>Nome *</label>
                    <input type="text" id="nome" maxlength="100">
                </div>
                <div class="campo">
                    <label>Tipo de resíduo aceito *</label>
                    <select id="tipoResiduoAceito">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Capacidade (kg) *</label>
                    <input type="number" id="capacidadeKg" min="0.01" step="0.01">
                </div>
                <div class="campo">
                    <label>Setor vinculado *</label>
                    <select id="setorId">
                        <option value="">Selecione...</option>
                    </select>
                </div>
            </div>
            <button class="btn" onclick="salvar()">Salvar</button>
            <button class="btn secundario" onclick="fecharFormulario()">Cancelar</button>
        </div>

        <div class="tabela-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Tipo aceito</th>
                        <th>Capacidade</th>
                        <th>Setor</th>
                        <th style="width:110px">Ações</th>
                    </tr>
                </thead>
                <tbody id="linhas"></tbody>
            </table>
        </div>
    </main>
</div>
<script src="js/pontos.js"></script>
</body>
</html>
