<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Resíduos - Recicladores</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
</head>
<body>
<div class="layout">
    <nav class="sidebar">
        <div class="logo">Gestão de Resíduos<small>ISO 14000 · APS</small></div>
        <a href="index.html">Dashboard</a>
        <a href="setores.html">Setores</a>
        <a href="residuos.html">Resíduos</a>
        <a href="pontos.html">Pontos de Coleta</a>
        <a href="coletas.html">Coletas</a>
        <a href="recicladores.html" class="ativo">Recicladores</a>
        <a href="relatorios.html">Relatórios</a>
    </nav>

    <main class="conteudo">
        <h1>Recicladores</h1>
        <div class="subtitulo">Parceiros externos (cooperativas e empresas) de destinação</div>

        <div id="alerta" class="alerta"></div>

        <div class="barra-acoes">
            <button class="btn" onclick="abrirFormulario()">+ Novo reciclador</button>
            <label class="filtros" style="font-size:13px;color:#6b7280;">
                <input type="checkbox" id="apenasAtivos" checked onchange="carregar()"> somente ativos
            </label>
        </div>

        <div class="formulario" id="formulario">
            <h3 id="form-titulo">Novo reciclador</h3>
            <div class="campos">
                <div class="campo">
                    <label>Nome *</label>
                    <input type="text" id="nome" maxlength="150">
                </div>
                <div class="campo">
                    <label>Tipo *</label>
                    <select id="tipo">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div class="campo">
                    <label>CNPJ *</label>
                    <input type="text" id="cnpj" maxlength="18" placeholder="00000000000000">
                </div>
                <div class="campo">
                    <label>Materiais aceitos</label>
                    <input type="text" id="materiaisAceitos" maxlength="255">
                </div>
                <div class="campo">
                    <label>Ativo</label>
                    <select id="ativo">
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>
            </div>
            <button class="btn" onclick="salvar()">Salvar</button>
            <button class="btn secundario" onclick="fecharFormulario()">Cancelar</button>
        </div>

        <div class="tabela-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>CNPJ</th>
                        <th>Materiais aceitos</th>
                        <th>Situação</th>
                        <th style="width:110px">Ações</th>
                    </tr>
                </thead>
                <tbody id="linhas"></tbody>
            </table>
        </div>
    </main>
</div>
<script src="js/recicladores.js"></script>
</body>
</html>
