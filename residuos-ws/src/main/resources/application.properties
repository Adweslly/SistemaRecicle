# ============================================================
# Configuracoes da aplicacao de gestao de residuos solidos
# ============================================================
server.port=8080

# --- Banco de dados H2 em memoria ---
spring.datasource.url=jdbc:h2:mem:residuosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Console web do H2 (acesse em /h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Tamanho maximo do corpo das requisicoes ---
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# --- Logs ---
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace